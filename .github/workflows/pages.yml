# Publishes this repository to GitHub Pages.
# Josh must set the repo Pages source to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source).
# A file in the repo cannot flip that setting. The first run publishes
# after this workflow is on main and the source is GitHub Actions.
# Project site: https://lpjproperties.github.io/funnels/
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
