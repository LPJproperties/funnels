name: Check site

on:
  pull_request:
  push:
    branches-ignore: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check site files
        run: python3 -m unittest discover -s tests -p 'check_*.py' -v
      - name: Check QR vendor
        run: node --test tests/qr_vendor.test.mjs
